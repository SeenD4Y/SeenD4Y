<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#020617"/>
      <stop offset=".5" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>

  <rect x="18" y="18" width="1164" height="264" rx="16"
        fill="none"
        stroke="#1E293B"/>

  <text x="65" y="65"
        fill="#8B5CF6"
        font-family="JetBrains Mono"
        font-size="14"
        letter-spacing="4">
    OPTIONAL QUEST // LINUX
  </text>

  <text x="65" y="96"
        fill="#64748B"
        font-family="JetBrains Mono"
        font-size="11"
        letter-spacing="2">
    DUAL-BOOT ENVIRONMENT
  </text>

  <!-- nodes -->

  <rect x="130" y="150" width="220" height="58" rx="10"
        fill="#071426"
        stroke="#3B82F6"/>

  <text x="240" y="185"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="JetBrains Mono"
        font-size="14">
    WINDOWS
  </text>

  <rect x="490" y="150" width="220" height="58" rx="10"
        fill="#071426"
        stroke="#F97316"/>

  <text x="600" y="185"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="JetBrains Mono"
        font-size="14">
    UBUNTU
  </text>

  <rect x="850" y="150" width="220" height="58" rx="10"
        fill="#071426"
        stroke="#38BDF8"/>

  <text x="960" y="185"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="JetBrains Mono"
        font-size="14">
    XUBUNTU
  </text>

  <line x1="350" y1="179" x2="490" y2="179"
        stroke="#334155"
        stroke-width="2"/>

  <line x1="710" y1="179" x2="850" y2="179"
        stroke="#334155"
        stroke-width="2"/>

  <!-- moving signal -->

  <circle cx="350" cy="179" r="5"
          fill="#22C55E"
          filter="url(#glow)">
    <animate attributeName="cx"
             values="350;490;710;850;350"
             dur="6s"
             repeatCount="indefinite"/>
  </circle>

  <text x="600" y="255"
        text-anchor="middle"
        fill="#64748B"
        font-family="JetBrains Mono"
        font-size="11"
        letter-spacing="2">
    PARTITION // UEFI // GRUB // FILESYSTEM // TERMINAL
  </text>

</svg>
